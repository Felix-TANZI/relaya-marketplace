# Configuration GitGuardian du projet.
#
# Les 14 occurrences remontees sur la PR #53 proviennent de deux fichiers
# de tests/demo du backend (backend/apps/shipping/tests.py et
# backend/apps/shipping/management/commands/seed_relay_counter_demo.py).
# Ce sont des mots de passe factices en dur ("Relay2026", "Client2026",
# "p", "DemoComptoir2026!", "secret-de-test"...) utilises uniquement pour
# creer des utilisateurs de test/demo jetables dans une base de test —
# aucun n'est un secret reel. Confirme sur le detail des findings de la
# PR #53 (type "Generic Password" sur les commits dde0269 et 62ef4d2).
#
# On ignore les chemins plutot que des hash de match individuels : les
# IDs affiches sur le dashboard GitGuardian (ex. 34923601) sont des IDs
# d'incident, pas le SHA256 attendu par `ignored_matches` — l'exclusion
# par chemin est donc le moyen fiable et verifiable de fermer ce bruit,
# sur le meme principe que l'exception tests/ de .gitleaks.toml.
#
# PR #70 (fusion dev1 + ecrans vendeur/relais) : meme bruit, deux nouveaux
# fichiers (backend/apps/accounts/tests.py et
# backend/apps/shipping/management/commands/seed_relay_history_demo.py).
# Memes mots de passe factices de tests/demo jetables, jamais utilises en
# dehors d'une base de test locale. Contrairement aux deux fichiers
# ci-dessus, ceux-ci sont ignores par valeur exacte (ignored_matches) et
# non par chemin : un vrai secret ajoute plus tard dans ces memes fichiers
# resterait detecte, puisque seules ces valeurs precises sont couvertes.
#
# PR #78 (vitrine belivay.com, main 1) : meme bruit, "Generic Password"
# sur POSTGRES_PASSWORD: belivay dans vitrine/ci-a-appliquer/ci.yml — ce
# fichier est une copie en attente (staging, l'auteur n'avait pas le
# scope OAuth "workflow" pour editer .github/workflows/ directement) du
# vrai .github/workflows/ci.yml, qui contient deja le meme mot de passe
# de test (conteneur Postgres ephemere de CI) sans jamais avoir declenche
# d'alerte — confirme caractere pour caractere identique a l'exception du
# job "vitrine" ajoute et de la liste de branches. Ignore par chemin,
# meme principe que les deux fichiers de tests ci-dessus.
#
# PR #90 (T07-2, DEV-SRV-01) : alerte 39882398, "Kyc-2026" dans
# backend/tests/test_d19_identite_vendeur.py — mot de passe d'un compte
# admin de test jetable, deja retire du fichier (commit 68a3b087,
# remplace par force_authenticate qui n'a pas besoin de mot de passe).
# Ignore par valeur exacte, meme principe que les commits de PR #70.
#
# PR #94 (T07-5, DEV-SRV-01) : alerte 39898948, "Ancien-2026" dans
# backend/apps/otp/tests/test_oubli.py — mot de passe d'un compte
# vendeur de test jetable, deja retire du fichier (commit 3e46573a).
# Ces deux alertes restent ouvertes sur le dashboard GitGuardian : cette
# exclusion evite qu'un futur scan les re-signale, mais la fermeture des
# incidents eux-memes (marquer "faux positif") demande un acces au
# dashboard, que cette configuration ne donne pas.

version: 2

secret:
  ignored_paths:
    - 'backend/apps/shipping/tests.py'
    - 'backend/apps/shipping/management/commands/seed_relay_counter_demo.py'
    - 'vitrine/ci-a-appliquer/ci.yml'
  ignored_matches:
    - name: "seed_relay_history_demo.py - mot de passe demo"
      match: "DemoHisto2026!"
    - name: "accounts/tests.py - mot de passe test generique"
      match: "pass"
    - name: "accounts/tests.py - mot de passe test TrustScore"
      match: "Trust2026!"
    - name: "accounts/tests.py - mot de passe test inscription client"
      match: "ClientSolide2026!"
    - name: "accounts/tests.py - mot de passe test compte existant"
      match: "Existing2026"
    - name: "test_d19_identite_vendeur.py - mot de passe test admin conformite (PR #90, alerte 39882398)"
      match: "Kyc-2026"
    - name: "otp/tests/test_oubli.py - mot de passe test vendeur sans email (PR #94, alerte 39898948)"
      match: "Ancien-2026"
