name: Maintenance Production

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action à exécuter"
        type: choice
        options:
          - diagnostic
          - restart
        default: diagnostic

jobs:
  maintenance:
    name: Maintenance serveur
    runs-on: ubuntu-latest
    # Nécessaire pour accéder aux secrets SSH_* (secrets d'environnement,
    # pas des secrets de dépôt) et pour passer par la même validation
    # manuelle ("Required reviewers") que le déploiement.
    environment: "Belivay Prod"

    steps:
      - name: Exécuter l'action
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            cd "${{ vars.TARGET_PATH }}"
            COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env.prod"

            if [ "${{ inputs.action }}" = "restart" ]; then
              echo "=== Images disponibles ==="
              docker images | grep belivay || echo "Aucune image belivay"
              echo "=== Redémarrage sans rebuild ==="
              $COMPOSE up -d --no-build
              $COMPOSE ps
            else
              echo "=== Mémoire ==="
              free -h
              echo "=== Disque ==="
              df -h /
              echo "=== Swap ==="
              swapon --show || echo "Aucun swap"
              echo "=== CPU ==="
              nproc
              echo "=== Containers ==="
              $COMPOSE ps
              echo "=== Sauvegardes de la base ==="
              PROBLEME=0
              LAST=$(ls -t /var/backups/belivay/*.sql.gz 2>/dev/null | head -1)
              if [ -z "$LAST" ]; then
                echo "ALERTE : aucune sauvegarde trouvée"
                PROBLEME=1
              else
                AGE_H=$(( ( $(date +%s) - $(stat -c %Y "$LAST") ) / 3600 ))
                echo "Dernière : $(basename "$LAST") - $(du -h "$LAST" | cut -f1), il y a ${AGE_H} h"
                if [ "$AGE_H" -gt 26 ]; then
                  echo "ALERTE : la dernière sauvegarde a plus de 26 h (le cron tourne chaque nuit)"
                  PROBLEME=1
                fi
              fi
              echo "--- Journal des sauvegardes (5 dernières lignes) ---"
              tail -5 /var/backups/belivay/backup.log 2>/dev/null || echo "Pas de journal"
              echo "=== Traces OOM (dmesg) ==="
              (sudo -n dmesg -T 2>/dev/null || dmesg -T 2>/dev/null) \
                | grep -iE "out of memory|killed process" \
                || echo "Aucune trace trouvée (ou accès refusé)"
              # Le run passe en rouge (donc email) si un problème a été relevé.
              [ "$PROBLEME" -eq 0 ] || exit 1
            fi