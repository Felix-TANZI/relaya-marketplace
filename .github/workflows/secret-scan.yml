name: Secret Scanning

# Scanne chaque push et chaque Pull Request à la recherche de secrets
# (clés API, mots de passe, tokens) qui auraient été commités par erreur.
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Recherche de secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}