# Configuration Gitleaks du projet.
#
# On conserve la totalité des règles par défaut de Gitleaks et on n'ajoute
# que deux exceptions ciblées : les fichiers de tests du backend, et les
# clés i18n du frontend.
#
# Pourquoi (tests) : la règle par défaut « generic-api-key » signale toute
# affectation du type password="..." dont l'entropie dépasse 3.5. Les suites
# de tests Django créent leurs utilisateurs avec des mots de passe factices
# écrits en dur (password="Secret-pass-123", "Courier2026", "Client2026"...).
# Ce ne sont pas des secrets : ils n'existent que dans une base de test
# jetable. Sans cette exception, chaque PR touchant un fichier de tests fait
# échouer le scan et l'alerte devient du bruit que l'on finit par ignorer.
#
# Pourquoi (clés i18n) : le frontend associe des libellés à des clés de
# traduction au format `domaine.sous_cle` ou `domaine.groupe.sous_cle` (ex.
# "sl9_ouverture.promise_gesture_prepare", "ad4_certifications.tier.bronze",
# voir frontend/src/i18n/domains/). Cette même règle generic-api-key confond
# parfois ces chaînes (labelKey: '...', titleKey: '...') avec une clé API à
# cause de leur entropie (mélange de minuscules, points, underscores).
# Repéré une première fois sur la PR #51 (3 faux positifs dans
# SellerPromise.tsx, clés à 2 segments), puis une seconde fois sur la PR #53
# (CertificationsPage.tsx, clés à 3 segments : "ad4_certifications.tier.
# bronze"/"...tier.silver"). L'exception couvre maintenant un nombre
# quelconque de segments séparés par un point. Elle reste volontairement
# étroite : seules des chaînes entièrement en minuscules/chiffres/underscores
# sont ignorées — un vrai secret (aléatoire, souvent avec majuscules/chiffres
# mêlés) ne prend pas cette forme.

[extend]
useDefault = true

[allowlist]
description = "Identifiants factices des suites de tests backend + clés i18n frontend"
paths = [
  # backend/apps/<app>/tests.py
  '''(^|/)tests\.py$''',
  # backend/tests/test_*.py, backend/apps/<app>/test_*.py
  '''(^|/)test_[^/]+\.py$''',
  # tout le contenu du répertoire backend/tests/ (fixtures, helpers)
  '''(^|/)tests/.*\.py$''',
]
regexes = [
  # Cle i18n "domaine_optionnellement_numerote.sous_cle[.sous_cle...]" —
  # entierement en minuscules/chiffres/underscores, un ou plusieurs points.
  # Ex. "sl9_ouverture.promise_gesture_prepare" (2 segments),
  # "ad4_certifications.tier.bronze" (3 segments). Ne matche jamais un
  # secret reel (majuscules, base64/hex, pas de point separateur de mots).
  '''^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$''',
]
