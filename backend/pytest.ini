[pytest]
DJANGO_SETTINGS_MODULE = relaya.settings.test
# `tests.py` est le nom que donne Django quand il cree une application. Il
# n'etait reconnu par aucun des deux motifs ci-dessous : `test_*.py` exige un
# souligne apres "test", `*_tests.py` exige un souligne avant "tests". Resultat,
# 201 tests ecrits et maintenus (comptes, expedition, commandes, vendeurs,
# commun) n'ont jamais ete executes par la CI.
python_files = test_*.py *_tests.py tests.py
pythonpath = .
addopts = -ra --cov=apps --cov-report=term-missing