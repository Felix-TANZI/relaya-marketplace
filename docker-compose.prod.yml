services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: unless-stopped
    networks:
      - relaya-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - relaya-network

  # Teste le 22/08/2026 : a une seule instance backend (9 workers gunicorn
  # synchrones), le brancher DEGRADE les performances par rapport a une
  # connexion directe et persistante vers Postgres. Garde defini, pret a
  # brancher (DATABASE_URL vers pgbouncer:6432, DB_CONN_MAX_AGE=0) le jour
  # ou plusieurs replicas backend tournent en parallele et risquent
  # d'epuiser max_connections a elles seules — pas avant.
  pgbouncer:
    image: bitnamilegacy/pgbouncer:1.24.1-debian-12-r10
    environment:
      - POSTGRESQL_HOST=postgres
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USERNAME=${POSTGRES_USER}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRESQL_DATABASE=${POSTGRES_DB}
      - PGBOUNCER_DATABASE=${POSTGRES_DB}
      - PGBOUNCER_PORT=6432
      - PGBOUNCER_POOL_MODE=transaction
      - PGBOUNCER_MAX_CLIENT_CONN=1000
      - PGBOUNCER_DEFAULT_POOL_SIZE=20
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - relaya-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file:
      - .env.prod
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    environment:
      # relaya.settings.prod, pas .base : `prod.py` refuse de demarrer si
      # ALLOWED_HOSTS n'est pas defini, au lieu de retomber silencieusement
      # sur le joker "*" herite de base.py. Cette ligne ecrasait le reglage
      # du Dockerfile (ENV DJANGO_SETTINGS_MODULE=relaya.settings.prod) et
      # desactivait donc ce garde-fou sans que rien ne le signale.
      - DJANGO_SETTINGS_MODULE=relaya.settings.prod
      - DEBUG=False
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-9}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - USE_R2_STORAGE=${USE_R2_STORAGE:-0}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-}
      - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL:-}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME:-auto}
      - AWS_S3_ADDRESSING_STYLE=${AWS_S3_ADDRESSING_STYLE:-path}
      - AWS_QUERYSTRING_EXPIRE=${AWS_QUERYSTRING_EXPIRE:-3600}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - relaya-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file:
      - .env.prod
    volumes:
      - media_volume:/app/mediafiles
    environment:
      # relaya.settings.prod, pas .base : `prod.py` refuse de demarrer si
      # ALLOWED_HOSTS n'est pas defini, au lieu de retomber silencieusement
      # sur le joker "*" herite de base.py. Cette ligne ecrasait le reglage
      # du Dockerfile (ENV DJANGO_SETTINGS_MODULE=relaya.settings.prod) et
      # desactivait donc ce garde-fou sans que rien ne le signale.
      - DJANGO_SETTINGS_MODULE=relaya.settings.prod
      - DEBUG=False
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - USE_R2_STORAGE=${USE_R2_STORAGE:-0}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-}
      - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL:-}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME:-auto}
      - AWS_S3_ADDRESSING_STYLE=${AWS_S3_ADDRESSING_STYLE:-path}
      - AWS_QUERYSTRING_EXPIRE=${AWS_QUERYSTRING_EXPIRE:-3600}
    command: celery -A relaya worker --loglevel=info --concurrency=4
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - relaya-network

  # Un service frontend par portail — chacun sert son propre sous-domaine
  # (voir nginx/nginx.conf) et embarque son propre VITE_PORTAL_ROLE, comme
  # les 6 applications mobiles. VITE_API_URL="/api" (relatif) volontairement
  # : chaque sous-domaine proxy sa propre route /api/ vers le meme backend
  # (voir nginx.conf), donc les appels restent "same-origin" et on evite
  # d'avoir a gerer CORS entre sous-domaines.
  # Ancien site client de belivay.com, mis de côté : la vitrine (service
  # « vitrine » ci-dessous) sert désormais belivay.com. Le service reste
  # défini (retour arrière : PR-VITRINE.md) mais ne démarre plus que si on
  # active son profil : `docker compose --profile ancien-front ...`.
  frontend-client:
    profiles: ["ancien-front"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
        VITE_PORTAL_ROLE: client
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_MAP_PROVIDER: ${VITE_MAP_PROVIDER:-openstreetmap}
    restart: unless-stopped
    networks:
      - relaya-network

  # ── Vitrine BelivaY (vitrine/, PR-VITRINE.md) ──────────────────────────────
  # Les six espaces web en démonstration sur belivay.com : / (client),
  # /vendeur/, /entreprise/, /livreur/, /relais/, /admin/. Fichiers seulement :
  # aucun secret, aucune base. nginx y envoie tout belivay.com sauf /api/,
  # /django-admin/, /static/, /media/ et les sitemaps du back-end.
  vitrine:
    build:
      context: ./vitrine
      target: web
      args:
        SITE_URL: https://belivay.com
    read_only: true
    restart: unless-stopped
    networks:
      - relaya-network

  # Comptes réels de la vitrine (vitrine/site/serveur/) : la même base Neon
  # que le site Vercel, pour que les comptes soient les mêmes des deux côtés.
  # Seul ce service reçoit ses secrets (pas d'env_file : rien du back-end).
  # Variables vides = comptes réels fermés, la démonstration continue.
  # nginx ne lui envoie que /api/auth/* et /api/admin/comptes* portant
  # ?espace=<un des six espaces> ; tout le reste de /api/ va au back-end.
  vitrine-comptes:
    build:
      context: ./vitrine
      target: comptes
    environment:
      - DATABASE_URL=${COMPTES_DATABASE_URL:-}
      - TOTP_CLE=${COMPTES_TOTP_CLE:-}
      - SECRET_COMPTES=${COMPTES_SECRET:-}
      - ADMIN_BOOTSTRAP_EMAIL=${COMPTES_ADMIN_BOOTSTRAP_EMAIL:-}
      - ADMIN_BOOTSTRAP_CODE=${COMPTES_ADMIN_BOOTSTRAP_CODE:-}
      - RESEND_API_KEY=${COMPTES_RESEND_API_KEY:-}
      - EMAIL_EXPEDITEUR=${COMPTES_EMAIL_EXPEDITEUR:-}
    read_only: true
    restart: unless-stopped
    networks:
      - relaya-network

  frontend-seller:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
        VITE_PORTAL_ROLE: seller
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_MAP_PROVIDER: ${VITE_MAP_PROVIDER:-openstreetmap}
    restart: unless-stopped
    networks:
      - relaya-network

  frontend-courier:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
        VITE_PORTAL_ROLE: courier
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_MAP_PROVIDER: ${VITE_MAP_PROVIDER:-openstreetmap}
    restart: unless-stopped
    networks:
      - relaya-network

  frontend-admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
        VITE_PORTAL_ROLE: admin
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_MAP_PROVIDER: ${VITE_MAP_PROVIDER:-openstreetmap}
    restart: unless-stopped
    networks:
      - relaya-network

  frontend-relay-point:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
        VITE_PORTAL_ROLE: relay_point
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_MAP_PROVIDER: ${VITE_MAP_PROVIDER:-openstreetmap}
    restart: unless-stopped
    networks:
      - relaya-network

  frontend-delivery-org:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
        VITE_PORTAL_ROLE: delivery_organization
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_MAP_PROVIDER: ${VITE_MAP_PROVIDER:-openstreetmap}
    restart: unless-stopped
    networks:
      - relaya-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/mediafiles:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - vitrine
      - vitrine-comptes
      - frontend-seller
      - frontend-courier
      - frontend-admin
      - frontend-relay-point
      - frontend-delivery-org
    restart: unless-stopped
    networks:
      - relaya-network

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - relaya-network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  relaya-network:
    driver: bridge
