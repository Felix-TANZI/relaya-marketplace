# docker-compose.reel.yml — SITE RÉEL seul (MAIN 2, puis MAIN 1 après la bascule) — DEV-SRV-01, T04 / T05 / T11.
#
# Même chose que docker-compose.prod.yml, sauf :
#   - ni vitrine ni serveur de comptes Neon (règles R1, R2 : la vitrine ne vit jamais avec le site réel) ;
#   - l'espace client (frontend-client) est actif : shop.belivay.com, puis belivay.com le 14/12 (T21) ;
#   - les écrans appellent https://api.belivay.com (VITE_API_URL) et leurs liens publics visent VITE_SITE_URL ;
#   - nginx charge nginx/reel.conf (api., shop., seller., driver., relay., delivery., admin.belivay.com).
#
# Choisi par deploy.sh quand .env.prod contient BELIVAY_COMPOSE=docker-compose.reel.yml (ops/SITE-REEL.md).
# Toute modification d'un service commun se reporte dans les deux fichiers.

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: unless-stopped
    networks:
      - relaya-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - relaya-network

  # Teste le 22/08/2026 : a une seule instance backend (9 workers gunicorn
  # synchrones), le brancher DEGRADE les performances par rapport a une
  # connexion directe et persistante vers Postgres. Garde defini, pret a
  # brancher (DATABASE_URL vers pgbouncer:6432, DB_CONN_MAX_AGE=0) le jour
  # ou plusieurs replicas backend tournent en parallele et risquent
  # d'epuiser max_connections a elles seules — pas avant.
  pgbouncer:
    image: bitnamilegacy/pgbouncer:1.24.1-debian-12-r10
    environment:
      - POSTGRESQL_HOST=postgres
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USERNAME=${POSTGRES_USER}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRESQL_DATABASE=${POSTGRES_DB}
      - PGBOUNCER_DATABASE=${POSTGRES_DB}
      - PGBOUNCER_PORT=6432
      - PGBOUNCER_POOL_MODE=transaction
      - PGBOUNCER_MAX_CLIENT_CONN=1000
      - PGBOUNCER_DEFAULT_POOL_SIZE=20
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - relaya-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file:
      - .env.prod
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    environment:
      # relaya.settings.prod, pas .base : `prod.py` refuse de demarrer si
      # ALLOWED_HOSTS n'est pas defini, au lieu de retomber silencieusement
      # sur le joker "*" herite de base.py. Cette ligne ecrasait le reglage
      # du Dockerfile (ENV DJANGO_SETTINGS_MODULE=relaya.settings.prod) et
      # desactivait donc ce garde-fou sans que rien ne le signale.
      - DJANGO_SETTINGS_MODULE=relaya.settings.prod
      - DEBUG=False
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-9}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - USE_R2_STORAGE=${USE_R2_STORAGE:-0}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-}
      - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL:-}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME:-auto}
      - AWS_S3_ADDRESSING_STYLE=${AWS_S3_ADDRESSING_STYLE:-path}
      - AWS_QUERYSTRING_EXPIRE=${AWS_QUERYSTRING_EXPIRE:-3600}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - relaya-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file:
      - .env.prod
    volumes:
      - media_volume:/app/mediafiles
    environment:
      # relaya.settings.prod, pas .base : `prod.py` refuse de demarrer si
      # ALLOWED_HOSTS n'est pas defini, au lieu de retomber silencieusement
      # sur le joker "*" herite de base.py. Cette ligne ecrasait le reglage
      # du Dockerfile (ENV DJANGO_SETTINGS_MODULE=relaya.settings.prod) et
      # desactivait donc ce garde-fou sans que rien ne le signale.
      - DJANGO_SETTINGS_MODULE=relaya.settings.prod
      - DEBUG=False
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - USE_R2_STORAGE=${USE_R2_STORAGE:-0}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-}
      - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL:-}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME:-auto}
      - AWS_S3_ADDRESSING_STYLE=${AWS_S3_ADDRESSING_STYLE:-path}
      - AWS_QUERYSTRING_EXPIRE=${AWS_QUERYSTRING_EXPIRE:-3600}
    command: celery -A relaya worker --loglevel=info --concurrency=4
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - relaya-network

  # Un service frontend par portail — chacun sert son propre sous-domaine
  # (voir nginx/reel.conf) et embarque son propre VITE_PORTAL_ROLE, comme
  # les 6 applications mobiles. Sur le site réel, tous appellent
  # https://api.belivay.com (VITE_API_URL) : une seule porte vers le back-end,
  # origines autorisées par CORS_ALLOWED_ORIGINS (DEV-SRV-01, T05/T11).
  # Espace client : shop.belivay.com, puis belivay.com le 14/12 (T21).
  frontend-client:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.belivay.com}
        VITE_SITE_URL: ${VITE_SITE_URL:-https://shop.belivay.com}
        VITE_PORTAL_ROLE: client
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_MAP_PROVIDER: ${VITE_MAP_PROVIDER:-openstreetmap}
        VITE_SUPPORT_WHATSAPP: ${VITE_SUPPORT_WHATSAPP:-237689002812}
    restart: unless-stopped
    networks:
      - relaya-network

  frontend-seller:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.belivay.com}
        VITE_SITE_URL: ${VITE_SITE_URL:-https://shop.belivay.com}
        VITE_PORTAL_ROLE: seller
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_MAP_PROVIDER: ${VITE_MAP_PROVIDER:-openstreetmap}
        VITE_SUPPORT_WHATSAPP: ${VITE_SUPPORT_WHATSAPP:-237689002812}
    restart: unless-stopped
    networks:
      - relaya-network

  frontend-courier:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.belivay.com}
        VITE_SITE_URL: ${VITE_SITE_URL:-https://shop.belivay.com}
        VITE_PORTAL_ROLE: courier
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_MAP_PROVIDER: ${VITE_MAP_PROVIDER:-openstreetmap}
        VITE_SUPPORT_WHATSAPP: ${VITE_SUPPORT_WHATSAPP:-237689002812}
    restart: unless-stopped
    networks:
      - relaya-network

  frontend-admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.belivay.com}
        VITE_SITE_URL: ${VITE_SITE_URL:-https://shop.belivay.com}
        VITE_PORTAL_ROLE: admin
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_MAP_PROVIDER: ${VITE_MAP_PROVIDER:-openstreetmap}
        VITE_SUPPORT_WHATSAPP: ${VITE_SUPPORT_WHATSAPP:-237689002812}
    restart: unless-stopped
    networks:
      - relaya-network

  frontend-relay-point:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.belivay.com}
        VITE_SITE_URL: ${VITE_SITE_URL:-https://shop.belivay.com}
        VITE_PORTAL_ROLE: relay_point
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_MAP_PROVIDER: ${VITE_MAP_PROVIDER:-openstreetmap}
        VITE_SUPPORT_WHATSAPP: ${VITE_SUPPORT_WHATSAPP:-237689002812}
    restart: unless-stopped
    networks:
      - relaya-network

  frontend-delivery-org:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.belivay.com}
        VITE_SITE_URL: ${VITE_SITE_URL:-https://shop.belivay.com}
        VITE_PORTAL_ROLE: delivery_organization
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_MAP_PROVIDER: ${VITE_MAP_PROVIDER:-openstreetmap}
        VITE_SUPPORT_WHATSAPP: ${VITE_SUPPORT_WHATSAPP:-237689002812}
    restart: unless-stopped
    networks:
      - relaya-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/reel.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/mediafiles:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend-client
      - frontend-seller
      - frontend-courier
      - frontend-admin
      - frontend-relay-point
      - frontend-delivery-org
    restart: unless-stopped
    networks:
      - relaya-network

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - relaya-network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  relaya-network:
    driver: bridge
