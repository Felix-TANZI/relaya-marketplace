x-frontend-common: &frontend-common
  image: relaya-marketplace-frontend
  build:
    context: ./frontend
    dockerfile: Dockerfile
  env_file:
    - .env
  volumes:
    - ./frontend:/app
    # Volume anonyme : isole les node_modules du conteneur (binaires Linux) du
    # dossier monté depuis l'hôte. Sans lui, le « npm install » écrit dans
    # ./frontend/node_modules et casse les outils locaux (vite, vitest) sur
    # une machine Windows ou macOS, à chaque démarrage du conteneur.
    - /app/node_modules

services:
  postgres:
    image: postgres:16-alpine
    container_name: relaya_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - relaya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: relaya_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Teste le 22/08/2026 : a cette echelle (9 workers gunicorn synchrones, une
  # seule instance), le brancher DEGRADE les performances (connexion neuve +
  # authentification a chaque requete, pool trop petit sous charge) par
  # rapport a une connexion directe et persistante vers Postgres. Il reste
  # defini ici, pret a etre branche (POSTGRES_HOST=pgbouncer, PORT=6432,
  # DB_CONN_MAX_AGE=0) le jour ou plusieurs instances/replicas du backend
  # tournent en parallele et risquent d'epuiser max_connections a elles
  # seules — pas avant.
  pgbouncer:
    image: bitnamilegacy/pgbouncer:1.24.1-debian-12-r10
    container_name: relaya_pgbouncer
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_USERNAME: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${POSTGRES_DB}
      PGBOUNCER_DATABASE: ${POSTGRES_DB}
      PGBOUNCER_PORT: "6432"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "1000"
      PGBOUNCER_DEFAULT_POOL_SIZE: "20"
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: relaya_backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "python -m pip install -r requirements.txt &&
             python manage.py runserver 0.0.0.0:8000"

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: relaya_celery_worker
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "python -m pip install -r requirements.txt &&
             celery -A relaya worker --loglevel=info"

  frontend-client:
    <<: *frontend-common
    container_name: relaya_frontend_client
    environment:
      VITE_PORTAL_ROLE: client
      VITE_DEV_PORT: 5173
    ports:
      - "5174:5173"
    command: >
      sh -c "npm run dev:client"

  frontend-admin:
    <<: *frontend-common
    container_name: relaya_frontend_admin
    environment:
      VITE_PORTAL_ROLE: admin
      VITE_DEV_PORT: 5176
    ports:
      - "5175:5176"
    command: >
      sh -c "npm run dev:admin"

  frontend-seller:
    <<: *frontend-common
    container_name: relaya_frontend_seller
    environment:
      VITE_PORTAL_ROLE: seller
      VITE_DEV_PORT: 5174
    ports:
      - "5176:5174"
    command: >
      sh -c "npm run dev:seller"

  frontend-courier:
    <<: *frontend-common
    container_name: relaya_frontend_courier
    environment:
      VITE_PORTAL_ROLE: courier
      VITE_DEV_PORT: 5175
    ports:
      - "5177:5175"
    command: >
      sh -c "npm run dev:courier"

  frontend-delivery-organization:
    <<: *frontend-common
    container_name: relaya_frontend_delivery_organization
    environment:
      VITE_PORTAL_ROLE: delivery_organization
      VITE_DEV_PORT: 5177
    ports:
      - "5178:5177"
    command: >
      sh -c "npm run dev:delivery-org"

  frontend-relay-point:
    <<: *frontend-common
    container_name: relaya_frontend_relay_point
    environment:
      VITE_PORTAL_ROLE: relay_point
      VITE_DEV_PORT: 5178
    ports:
      - "5179:5178"
    command: >
      sh -c "npm run dev:relay-point"

volumes:
  relaya_pgdata:
