[pytest]
DJANGO_SETTINGS_MODULE = config.settings
# « apps » est un paquet d'espace de noms : le kit (../apps) et les bouchons de relaya (stubs/apps) ; moteurs purs.
pythonpath = . stubs .. ../../moteurs
testpaths = ../apps
python_files = test_*.py *_tests.py
addopts = -ra -p essai_fixtures -p no:cacheprovider --cov=apps --cov-report=term-missing:skip-covered
filterwarnings =
    ignore::DeprecationWarning
