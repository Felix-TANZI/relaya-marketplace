# Généré par backend-kit/outils/generer-openapi.mts : ne pas modifier à la main.
openapi: 3.1.0
info:
  title: BelivaY — API de l’espace client
  version: 0.1.0
  description: |-
    Contrat des routes que le site client (site/, VITE_SOURCE=api) appelle : les routes existantes de relaya-marketplace
    (commit 9546ffe) et toutes les routes à créer. Généré par backend-kit/outils/generer-openapi.mts depuis
    site/src/api/routes.ts et site/src/donnees/source.ts ; ne pas modifier à la main.

    - Réponses des routes à créer : les types de source.ts tels quels (champs camelCase, dates en ms).
    - Montants : francs CFA entiers (CAP-06). Erreurs : `{ "error": { "code", "message", "data" } }` (CAP-04).
    - `Idempotency-Key` : même clé, même réponse, pendant 24 h (CAP-03).
    - Pagination par curseur (`cursor`, `next_cursor`, CAP-05). Langue : `Accept-Language` (CAP-08).
    - Un module fermé par son interrupteur (FF-*) répond 404 sur ses routes (CAP-13).
servers:
  - url: https://belivay.com
    description: Production (nginx route /api/ vers Django)
  - url: http://localhost:8000
    description: Développement
security:
  - jwt: []
tags:
  - name: Contenus et photos
  - name: Connexion et inscription
  - name: Sécurité, confidentialité, suppression
  - name: Diaspora et proches
  - name: Favoris
  - name: Panier et panier partagé
  - name: Session, menu et compte
  - name: Notifications
  - name: Profil, numéro et codes
  - name: Catalogue, fiche et avis produit
  - name: Ventes flash
  - name: Échanges entre clients
  - name: Paiement
  - name: Messagerie, aide et rappel
  - name: Litiges et retours
  - name: Légal
  - name: Relais, adresses, intérêts
  - name: Devenir vendeur
  - name: Abonnement et cagnotte
  - name: Portefeuille, moyens de paiement, factures
  - name: Panier famille
  - name: Mises de côté
  - name: Cotisations
  - name: Troc
  - name: Listes d'envies
  - name: Commandes, retrait et modification
  - name: Avis sur une commande
  - name: Rentrée scolaire
  - name: WhatsApp
paths:
  /api/admin/media:
    post:
      operationId: post_admin_media
      tags:
        - Contenus et photos
      summary: "(admin : téléversement) — à créer"
      description: |-
        Méthode(s) de la source du site : `(admin : téléversement)`.
        - Équipe seulement (is_staff) : 403 sinon. Multipart. Variantes WebP 320/640/960/1600 px (srcset) si Pillow est installé.
      x-belivay-etat: serveur
      x-belivay-sources:
        - "(admin : téléversement)"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - fichier
              properties:
                fichier:
                  type: string
                  format: binary
                  description: JPEG, PNG, WebP ou AVIF, 8 Mo au plus
                alt:
                  type: string
      responses:
        "200":
          description: Succès
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PhotoServeur"
                  - type: object
                    required:
                      - id
                    properties:
                      id:
                        type: integer
        "400":
          $ref: "#/components/responses/Invalide"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "422":
          description: "Refusé par une règle métier : photo_type, photo_taille"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Erreur"
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            type: string
                            enum:
                              - photo_type
                              - photo_taille
        "429":
          $ref: "#/components/responses/TropDeRequetes"
  /api/auth/apple/:
    post:
      operationId: post_auth_apple_relaya
      tags:
        - Connexion et inscription
      summary: connecter — existe (relaya-marketplace)
      description: |-
        Méthode(s) de la source du site : `connecter`.
        - connecter : Routes existantes. Manque côté site : Google Identity Services (VITE_GOOGLE_CLIENT_ID) et Sign in with Apple JS (VITE_APPLE_CLIENT_ID) pour obtenir le jeton.
      x-belivay-etat: front
      x-belivay-sources:
        - connecter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identity_token:
                  type: string
                authorization_code:
                  type: string
              required:
                - identity_token
                - authorization_code
      responses:
        "200":
          description: Succès
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RJetons"
                  - $ref: "#/components/schemas/RDeuxFacteurs"
        "400":
          $ref: "#/components/responses/Invalide"
        "429":
          $ref: "#/components/responses/TropDeRequetes"
      security:
        - {}
        - jwt: []
  /api/auth/change-password/:
    post:
      operationId: post_auth_change_password_relaya
      tags:
        - Sécurité, confidentialité, suppression
      summary: changerMotDePasse — existe (relaya-marketplace)
      description: |-
        Méthode(s) de la source du site : `changerMotDePasse`.
        - changerMotDePasse : Premier mot de passe (compte Google ou Apple, ancien = null) : route à créer POST /api/auth/password/set. Fermer les autres sessions (CAP-17).
      x-belivay-etat: branche
      x-belivay-sources:
        - changerMotDePasse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
                new_password2:
                  type: string
              required:
                - old_password
                - new_password
                - new_password2
      responses:
        "200":
          description: Succès, sans contenu
        "400":
          description: "Requête invalide (champs) : old_password, new_password"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Erreur"
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            type: string
                            enum:
                              - old_password
                              - new_password
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "429":
          $ref: "#/components/responses/TropDeRequetes"
  /api/auth/diaspora/register:
    post:
      operationId: post_auth_diaspora_register
      tags:
        - Diaspora et proches
      summary: inscrireDiaspora — à créer
      description: |-
        Méthode(s) de la source du site : `inscrireDiaspora`.
        - inscrireDiaspora : Communs : prénom, nom, naissance (18 ans), pays accepté et son indicatif, numéro de ce pays (jamais +237) vérifié par code SMS. Google/Apple : e-mail repris du jeton (déjà vérifié), ni mot de passe ni code e-mail ; convertir=true passe le compte existant en diaspora. Numéro : e-mail facultatif.
      x-belivay-etat: branche
      x-belivay-sources:
        - inscrireDiaspora
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prenom:
                  type: string
                nom:
                  type: string
                email:
                  type: string
                motDePasse:
                  type: string
                codeEmail:
                  type: string
                naissance:
                  type: string
                pays:
                  type: string
                ville:
                  type: string
                indicatif:
                  type: string
                numero:
                  type: string
                code:
                  type: string
              required:
                - prenom
                - nom
                - email
                - motDePasse
                - codeEmail
                - naissance
                - pays
                - ville
                - indicatif
                - numero
                - code
      responses:
        "200":
          description: Succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reponse_inscrireDiaspora"
        "400":
          $ref: "#/components/responses/Invalide"
        "409":
          description: "Conflit : la situation a changé : existe"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Erreur"
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            type: string
                            enum:
                              - existe
        "422":
          description: "Refusé par une règle métier : code, codeEmail, age, pays, numero, jeton"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Erreur"
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            type: string
                            enum:
                              - code
                              - codeEmail
                              - age
                              - pays
                              - numero
                              - jeton
        "429":
          $ref: "#/components/responses/TropDeRequetes"
      security:
        - {}
        - jwt: []
  /api/auth/favorites/:
    get:
      operationId: get_auth_favorites_relaya
      tags:
        - Favoris
        - Panier et panier partagé
      summary: favoris, basculerFavori, panier — existe (relaya-marketplace)
      description: |-
        Méthode(s) de la source du site : `favoris`, `basculerFavori`, `panier`.
        - favoris : Manquent : variante, prix à l’ajout, prix livré au relais, état du stock (retour), alertes.
        - panier : Kit : apps/cart (frais du moteur, comptoir, changements CAL-11). Panier d’un visiteur par X-Device-Id : à faire (D18).
      x-belivay-etat: partiel,branche
      x-belivay-sources:
        - favoris
        - basculerFavori
        - panier
      responses:
        "200":
          description: Succès
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/RFavori"
                  - type: object
                    properties:
                      count:
                        type: integer
                      next:
                        type:
                          - string
                          - "null"
                      results:
                        type: array
                        items:
                          $ref: "#/components/schemas/RFavori"
                    required:
                      - results
        "401":
          $ref: "#/components/responses/NonAuthentifie"
    post:
      operationId: post_auth_favorites_relaya
      tags:
        - Favoris
      summary: basculerFavori, remettreFavori — existe (relaya-marketplace)
      description: "Méthode(s) de la source du site : `basculerFavori`, `remettreFavori`."
      x-belivay-etat: branche
      x-belivay-sources:
        - basculerFavori
        - remettreFavori
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id:
                  type: string
      responses:
        "200":
          description: Succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RFavori"
        "400":
          $ref: "#/components/responses/Invalide"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "429":
          $ref: "#/components/responses/TropDeRequetes"
  /api/auth/favorites/{id}/:
    delete:
      operationId: delete_auth_favorites_id_relaya
      tags:
        - Favoris
      summary: basculerFavori, retirerFavori — existe (relaya-marketplace)
      description: "Méthode(s) de la source du site : `basculerFavori`, `retirerFavori`."
      x-belivay-etat: branche
      x-belivay-sources:
        - basculerFavori
        - retirerFavori
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Succès, sans contenu
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "429":
          $ref: "#/components/responses/TropDeRequetes"
  /api/auth/google/:
    post:
      operationId: post_auth_google_relaya
      tags:
        - Connexion et inscription
      summary: connecter — existe (relaya-marketplace)
      description: |-
        Méthode(s) de la source du site : `connecter`.
        - connecter : Routes existantes. Manque côté site : Google Identity Services (VITE_GOOGLE_CLIENT_ID) et Sign in with Apple JS (VITE_APPLE_CLIENT_ID) pour obtenir le jeton.
      x-belivay-etat: front
      x-belivay-sources:
        - connecter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                credential:
                  type: string
              required:
                - credential
      responses:
        "200":
          description: Succès
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RJetons"
                  - $ref: "#/components/schemas/RDeuxFacteurs"
        "400":
          $ref: "#/components/responses/Invalide"
        "429":
          $ref: "#/components/responses/TropDeRequetes"
      security:
        - {}
        - jwt: []
  /api/auth/login/:
    post:
      operationId: post_auth_login_relaya
      tags:
        - Connexion et inscription
      summary: connecterEmail, inscrire — existe (relaya-marketplace)
      description: |-
        Méthode(s) de la source du site : `connecterEmail`, `inscrire`.
        - connecterEmail : Le serveur ne renvoie pas les essais restants (CIN : 5 essais puis 15 min) ; limite actuelle 5/min par IP. La 2FA par e-mail (2fa_required) n'a pas d'écran.
        - inscrire : Spécification : POST /auth/email {mode: signup} (409 e-mail pris).
      x-belivay-etat: branche
      x-belivay-sources:
        - connecterEmail
        - inscrire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    username:
                      type: string
                      description: e-mail
                    password:
                      type: string
                  required:
                    - username
                    - password
                - type: object
                  properties:
                    i:
                      $ref: "#/components/schemas/Param_inscrire_0"
                    seSouvenir:
                      $ref: "#/components/schemas/Param_inscrire_1"
                  required:
                    - i
                    - seSouvenir
      responses:
        "200":
          description: Succès
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RJetons"
                  - $ref: "#/components/schemas/RDeuxFacteurs"
        "400":
          $ref: "#/components/responses/Invalide"
        "429":
          $ref: "#/components/responses/TropDeRequetes"
      security:
        - {}
        - jwt: []
  /api/auth/logout/:
    post:
      operationId: post_auth_logout_relaya
      tags:
        - Connexion et inscription
      summary: deconnecter — existe (relaya-marketplace)
      description: |-
        Méthode(s) de la source du site : `deconnecter`.
        - deconnecter : Révoquer aussi le jeton de notifications (DELETE /api/devices, CAP-17).
      x-belivay-etat: branche
      x-belivay-sources:
        - deconnecter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh:
                  type: string
              required:
                - refresh
      responses:
        "204":
          description: Succès, sans contenu
        "400":
          $ref: "#/components/responses/Invalide"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "429":
          $ref: "#/components/responses/TropDeRequetes"
  /api/auth/me/:
    get:
      operationId: get_auth_me_relaya
      tags:
        - Session, menu et compte
        - Sécurité, confidentialité, suppression
      summary: session, securite — existe (relaya-marketplace)
      description: |-
        Méthode(s) de la source du site : `session`, `securite`.
        - session : Interrupteurs : GET /api/config/flags (kit) ; relais habituel : GET /api/me (kit). Manquent : horaire du jour en mots du relais, chiffres du bandeau (quartiers exploités, seuil de retrait offert), type de compte, devise et proche actif (diaspora). À terme un seul GET /api/me (CL-02).
        - securite : Numéro vérifié : GET /api/me (kit). Manquent : date de vérification, comptes Google/Apple liés, historique des connexions, lieu, biométrie, seuil CODE-BIO, alerte de connexion (écrite par PATCH /api/me/security, pas encore relue).
      x-belivay-etat: partiel
      x-belivay-sources:
        - session
        - securite
      responses:
        "200":
          description: Succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RUtilisateur"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
  /api/auth/notifications/:
    get:
      operationId: get_auth_notifications_relaya
      tags:
        - Session, menu et compte
        - Notifications
      summary: session, notificationsClient — existe (relaya-marketplace)
      description: |-
        Méthode(s) de la source du site : `session`, `notificationsClient`.
        - session : Interrupteurs : GET /api/config/flags (kit) ; relais habituel : GET /api/me (kit). Manquent : horaire du jour en mots du relais, chiffres du bandeau (quartiers exploités, seuil de retrait offert), type de compte, devise et proche actif (diaspora). À terme un seul GET /api/me (CL-02).
        - notificationsClient : Manquent : catégorie « Retrait » distincte, envoi par SMS (sms), pagination par curseur (30 par page, CAP-05).
      x-belivay-etat: partiel
      x-belivay-sources:
        - session
        - notificationsClient
      parameters:
        - $ref: "#/components/parameters/Curseur"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 30
      responses:
        "200":
          description: Succès
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/RNotification"
                  - type: object
                    properties:
                      count:
                        type: integer
                      next:
                        type:
                          - string
                          - "null"
                      results:
                        type: array
                        items:
                          $ref: "#/components/schemas/RNotification"
                    required:
                      - results
        "401":
          $ref: "#/components/responses/NonAuthentifie"
  /api/auth/notifications/{id}/read/:
    post:
      operationId: post_auth_notifications_id_read_relaya
      tags:
        - Notifications
      summary: lireNotification — existe (relaya-marketplace)
      description: "Méthode(s) de la source du site : `lireNotification`."
      x-belivay-etat: branche
      x-belivay-sources:
        - lireNotification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Succès, sans contenu
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "429":
          $ref: "#/components/responses/TropDeRequetes"
  /api/auth/notifications/read-all/:
    post:
      operationId: post_auth_notifications_read_all_relaya
      tags:
        - Notifications
      summary: lireNotification — existe (relaya-marketplace)
      description: "Méthode(s) de la source du site : `lireNotification`."
      x-belivay-etat: branche
      x-belivay-sources:
        - lireNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  $ref: "#/components/schemas/Param_lireNotification_0"
              required:
                - id
      responses:
        "204":
          description: Succès, sans contenu
        "400":
          $ref: "#/components/responses/Invalide"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "429":
          $ref: "#/components/responses/TropDeRequetes"
  /api/auth/otp/send:
    post:
      operationId: post_auth_otp_send
      tags:
        - Profil, numéro et codes
        - Diaspora et proches
      summary: envoyerCode, envoyerCodeDiaspora — à créer
      description: |-
        Méthode(s) de la source du site : `envoyerCode`, `envoyerCodeDiaspora`.
        - envoyerCode : purpose = l’objet du site (profil, email-sms, email-adresse, numero-ancien, numero-nouveau, moyen, suppression) ; sans destination : le numéro vérifié du compte. Prestataire SMS : console dans le kit (à désigner).
        - envoyerCodeDiaspora : Inscription : sans compte, à la destination donnée. Vérification renforcée d’une commande pour un proche (numéro masqué du compte) : diaspora-renforce, au numéro étranger vérifié du compte.
      x-belivay-etat: branche
      x-belivay-sources:
        - envoyerCode
        - envoyerCodeDiaspora
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose:
                  anyOf:
                    - type: string
                    - type: string
                      description: diaspora | diaspora-renforce
                destination:
                  type: string
                canal:
                  type: string
                  enum:
                    - sms
                    - whatsapp
                    - email
      responses:
        "202":
          description: Succès
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Reponse_envoyerCode"
                  - $ref: "#/components/schemas/Reponse_envoyerCodeDiaspora"
        "400":
          $ref: "#/components/responses/Invalide"
        "429":
          $ref: "#/components/responses/TropDeRequetes"
      security:
        - {}
        - jwt: []
  /api/auth/otp/verify:
    post:
      operationId: post_auth_otp_verify
      tags:
        - Profil, numéro et codes
        - Diaspora et proches
      summary: verifierPremierNumero, verifierCodeEmail, verifierCodeNumeroAncien, verifierCodeDiaspora — à créer
      description: |-
        Méthode(s) de la source du site : `verifierPremierNumero`, `verifierCodeEmail`, `verifierCodeNumeroAncien`, `verifierCodeDiaspora`.
        - verifierPremierNumero : relaya : POST /api/auth/phone/validate/ normalise le numéro sans le vérifier.
      x-belivay-etat: branche
      x-belivay-sources:
        - verifierPremierNumero
        - verifierCodeEmail
        - verifierCodeNumeroAncien
        - verifierCodeDiaspora
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                numero:
                  type: string
                code:
                  type: string
                purpose:
                  anyOf:
                    - anyOf:
                        - type: string
                          description: email-sms
                        - type: string
                          description: numero-ancien
                    - type: string
                      enum:
                        - diaspora
                destination:
                  type: string
      responses:
        "200":
          description: Succès
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Reponse_verifierPremierNumero"
                  - $ref: "#/components/schemas/Reponse_verifierCodeEmail"
                  - $ref: "#/components/schemas/Reponse_verifierCodeNumeroAncien"
                  - $ref: "#/components/schemas/Reponse_verifierCodeDiaspora"
        "400":
          $ref: "#/components/responses/Invalide"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "409":
          description: "Conflit : la situation a changé : utilise"
          content:
            application/json:
              schema:
