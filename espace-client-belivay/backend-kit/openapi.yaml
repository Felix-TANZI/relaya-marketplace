components:
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: simplejwt (POST /api/auth/login/, /api/auth/refresh/)
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "Clé d’idempotence (CAP-03) : la même clé rejoue la même réponse ; une clé réutilisée avec un autre corps répond 422 idempotency_mismatch."
      schema:
        type: string
        minLength: 8
        maxLength: 120
    Curseur:
      name: cursor
      in: query
      required: false
      description: Curseur opaque rendu dans next_cursor (CAP-05).
      schema:
        type: string
    DeviceId:
      name: X-Device-Id
      in: header
      required: false
      description: "Identifiant de l’appareil (CAP-02) : panier d’un visiteur."
      schema:
        type: string
  responses:
    NonAuthentifie:
      description: Jeton absent, expiré ou révoqué
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erreur"
    Invalide:
      description: "Champs invalides : error.code = invalid, error.data.fields = { champ: [messages] }"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erreur"
    Introuvable:
      description: Introuvable, ou module fermé (CAP-13)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erreur"
    TropDeRequetes:
      description: Limitation de débit (CAP-20) ; en-tête Retry-After
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erreur"
  schemas:
    Erreur:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Code stable en snake_case (CAP-04)
            message:
              type: string
              description: Message déjà traduit (Accept-Language)
            data:
              description: Détails (fields pour une erreur de champs, montants pour price_changed…)
    FraisPanierServeur:
      type: object
      description: belivay_moteurs.frais.FraisPanier (CAL-06 à CAL-11), francs entiers
      required:
        - sous_total
        - ramassages
        - remises
        - supplements
        - offert
        - total
        - seuil
        - colis
        - manque_pour_seuil
        - progression_pour_cent
      properties:
        sous_total:
          type: integer
        ramassages:
          type: integer
        remises:
          type: integer
        supplements:
          type: integer
        offert:
          type: integer
        total:
          type: integer
        seuil:
          type: integer
        colis:
          type: integer
        economie:
          type: integer
        reste_ramassages:
          type: integer
        manque_pour_seuil:
          type: integer
        progression_pour_cent:
          type: integer
    EligibiliteComptoir:
      type: object
      description: belivay_moteurs.comptoir.eligibilite (CAL-13, CPN-36)
      required:
        - propose
        - plafond
        - palier
      properties:
        propose:
          type: boolean
        ligne:
          type:
            - string
            - "null"
          description: "« Paiement au comptoir non proposé : … », null : pas de ligne"
        plafond:
          type: integer
        palier:
          type: string
          enum:
            - nouveau compte
            - standard
            - fidèle
        maintenant:
          type: integer
          description: livraison payée d’avance
        au_retrait:
          type: integer
    RUtilisateur:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type:
            - string
            - "null"
        avatar_url:
          type:
            - string
            - "null"
        has_usable_password:
          type: boolean
        loyalty_points:
          type: integer
      required:
        - id
        - username
        - email
        - first_name
        - last_name
        - phone
        - avatar_url
    RNotification:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        message:
          type: string
        notification_type:
          type: string
          enum:
            - ORDER
            - PROMOTION
            - PAYMENT
            - SUPPORT
            - SYSTEM
        action_url:
          type:
            - string
            - "null"
        is_read:
          type: boolean
        created_at:
          type: string
      required:
        - id
        - title
        - message
        - notification_type
        - action_url
        - is_read
        - created_at
    RProduit:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        description:
          type:
            - string
            - "null"
        short_description:
          type:
            - string
            - "null"
        price_xaf:
          type: integer
        price_final:
          type:
            - integer
            - "null"
        compare_at_price:
          type:
            - integer
            - "null"
        stock_quantity:
          type:
            - integer
            - "null"
        rating_average:
          type:
            - number
            - "null"
        reviews_count:
          type:
            - integer
            - "null"
        category:
          anyOf:
            - type: integer
            - type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
                slug:
                  type: string
              required:
