# nginx/lancement-pret/belivay-com.conf — PRÉPARÉ, INACTIF (DEV-SRV-01, T21 / T24)
# « Préparer la configuration qui fait pointer belivay.com vers l'espace client réel. »
#
# Activé le 14 décembre par : ops/lancement/activer.sh belivay-com
# (copie dans nginx/lancement/, que nginx/reel.conf.template inclut ; nginx -t avant tout rechargement).
# Prérequis : certificat « belivay.com » étendu à belivay.com et www.belivay.com ; DNS de belivay.com vers ce serveur ;
# VITE_SITE_URL et FRONTEND_URL = https://belivay.com, belivay.com ajouté à CORS_ALLOWED_ORIGINS (ops/lancement/).

server {
    listen 80;
    server_name belivay.com www.belivay.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://belivay.com$request_uri;
    }
}

# www → belivay.com : une seule adresse pour le site public.
server {
    listen 443 ssl http2;
    server_name www.belivay.com;
    ssl_certificate /etc/letsencrypt/live/belivay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belivay.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://belivay.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name belivay.com;

    ssl_certificate /etc/letsencrypt/live/belivay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belivay.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Même maintenance que le reste du site réel (nginx/reel.conf.template).
    set $maintenance 0;
    if (-f /etc/nginx/maintenance/actif) { set $maintenance 1; }
    if ($uri = /__maintenance.html) { set $maintenance 0; }
    if ($maintenance = 1) { return 503; }
    error_page 503 /__maintenance.html;
    location = /__maintenance.html { root /etc/nginx/maintenance; internal; }

    # Anciens chemins de la vitrine sur belivay.com (/vendeur/, /relais/…) : vers les espaces réels (T22, T25).
    location ^~ /vendeur/    { return 301 https://seller.belivay.com/; }
    location ^~ /relais/     { return 301 https://relay.belivay.com/; }
    location ^~ /livreur/    { return 301 https://driver.belivay.com/; }
    location ^~ /entreprise/ { return 301 https://delivery.belivay.com/; }
    location ^~ /admin/      { return 301 https://admin.belivay.com/; }

    # Plans du site générés par le back-end (servis à la racine du domaine public).
    location = /sitemap-products.xml   { proxy_pass http://backend/api/sitemap-products.xml; proxy_set_header Host $host; }
    location = /sitemap-categories.xml { proxy_pass http://backend/api/sitemap-categories.xml; proxy_set_header Host $host; }

    location /media/compliance/ { return 404; }
    location /media/ { alias /app/mediafiles/; }

    location / {
        proxy_pass http://frontend_client;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
