# nginx/lancement-pret/redirections-vitrine.conf — PRÉPARÉ, INACTIF (DEV-SRV-01, T22 / T25)
# « Préparer une redirection permanente de chaque adresse française vers son équivalent anglais (vendeur → seller,
# etc.) en conservant le reste du lien, et l'arrêt d'api-demo. »
#
# Activé le 14 décembre par : ops/lancement/activer.sh redirections-vitrine
# Prérequis : DNS des adresses françaises vers ce serveur ; certificat « belivay.com » étendu à ces adresses.
#
#   boutique.belivay.com  → belivay.com            (l'espace client est sur belivay.com depuis le 14/12)
#   vendeur.belivay.com   → seller.belivay.com
#   relais.belivay.com    → relay.belivay.com
#   livreur.belivay.com   → driver.belivay.com
#   livraison.belivay.com → delivery.belivay.com
#   api-demo.belivay.com  → 410 « la démonstration est terminée » (jamais redirigée vers l'API réelle : règle R1)

server {
    listen 80;
    server_name boutique.belivay.com vendeur.belivay.com relais.belivay.com livreur.belivay.com
                livraison.belivay.com api-demo.belivay.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name boutique.belivay.com;
    ssl_certificate /etc/letsencrypt/live/belivay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belivay.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://belivay.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vendeur.belivay.com;
    ssl_certificate /etc/letsencrypt/live/belivay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belivay.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://seller.belivay.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name relais.belivay.com;
    ssl_certificate /etc/letsencrypt/live/belivay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belivay.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://relay.belivay.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name livreur.belivay.com;
    ssl_certificate /etc/letsencrypt/live/belivay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belivay.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://driver.belivay.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name livraison.belivay.com;
    ssl_certificate /etc/letsencrypt/live/belivay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belivay.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://delivery.belivay.com$request_uri;
}

# Arrêt d'api-demo : une application de démonstration oubliée reçoit un refus clair, jamais l'API réelle.
server {
    listen 443 ssl http2;
    server_name api-demo.belivay.com;
    ssl_certificate /etc/letsencrypt/live/belivay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belivay.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    default_type application/json;
    return 410 '{"detail": "La démonstration BelivaY est terminée. Rendez-vous sur https://belivay.com."}';
}
