# nginx/lancement-pret/vitrine.conf — PRÉPARÉ, INACTIF (DEV-SRV-01, T08 / T13, décision du porteur du 11/11)
# « MAIN 1 : site réel, et vitrine jusqu'au 14/12. » La vitrine (service « vitrine » de docker-compose.reel.yml,
# démarré avec VITRINE_SUR_REEL=1) partage le nginx du site réel, sur ses propres adresses :
#   belivay.com, www, boutique.belivay.com → espace client de démonstration ;
#   vendeur., relais., livreur., livraison.belivay.com → espaces de démonstration (T08, T13).
#
# Activé le soir du transfert, après le transfert (ops/MAIN1-REEL-ET-VITRINE.md) : ops/lancement/activer.sh vitrine
# Retiré le 14 décembre, AVANT belivay-com et redirections-vitrine (mêmes adresses) : activer.sh vitrine --retirer
#
# Règles tenues ici, quoi que fasse la vitrine :
#   R1 / R2 : aucune requête de ces adresses n'atteint le back-end réel — tout /api/ répond 410 ;
#   R6      : fermée aux moteurs de recherche (X-Robots-Tag ; robots.txt « Disallow: / » dans la vitrine).
# Prérequis : certificat « belivay.com » étendu à ces sept adresses ; DNS de ces adresses vers MAIN 1.

upstream vitrine_demo {
    server vitrine:8080;
}

server {
    listen 80;
    server_name belivay.com www.belivay.com boutique.belivay.com vendeur.belivay.com relais.belivay.com
                livreur.belivay.com livraison.belivay.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Espace client de démonstration : belivay.com (jusqu'au 14/12), www et boutique.
server {
    listen 443 ssl http2;
    server_name belivay.com www.belivay.com boutique.belivay.com;
    ssl_certificate /etc/letsencrypt/live/belivay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belivay.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /api/ { return 410; }
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://vitrine_demo;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Un espace par adresse : la racine ouvre son chemin dans la vitrine (/vendeur/, /relais/…), le reste passe tel quel
# (les fichiers de chaque espace sont servis sous son chemin, et les liens entre espaces continuent de marcher).
server {
    listen 443 ssl http2;
    server_name vendeur.belivay.com;
    ssl_certificate /etc/letsencrypt/live/belivay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belivay.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = / { return 302 /vendeur/; }
    location /api/ { return 410; }
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://vitrine_demo;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name relais.belivay.com;
    ssl_certificate /etc/letsencrypt/live/belivay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belivay.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = / { return 302 /relais/; }
    location /api/ { return 410; }
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://vitrine_demo;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name livreur.belivay.com;
    ssl_certificate /etc/letsencrypt/live/belivay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belivay.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = / { return 302 /livreur/; }
    location /api/ { return 410; }
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://vitrine_demo;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name livraison.belivay.com;
    ssl_certificate /etc/letsencrypt/live/belivay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belivay.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = / { return 302 /entreprise/; }
    location /api/ { return 410; }
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://vitrine_demo;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
