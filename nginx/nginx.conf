upstream backend {
    server backend:8000;
}

upstream frontend_client {
    server frontend-client:80;
}

upstream frontend_seller {
    server frontend-seller:80;
}

upstream frontend_courier {
    server frontend-courier:80;
}

upstream frontend_admin {
    server frontend-admin:80;
}

upstream frontend_relay_point {
    server frontend-relay-point:80;
}

upstream frontend_delivery_org {
    server frontend-delivery-org:80;
}

# Redirige tout le trafic HTTP vers HTTPS, pour les 6 domaines.
server {
    listen 80;
    server_name belivay.com www.belivay.com admin.belivay.com seller.belivay.com courier.belivay.com relay-point.belivay.com delivery-org.belivay.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Client (marketplace) ─────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name belivay.com www.belivay.com;
    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/belivay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belivay.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://frontend_client;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Sitemaps dynamiques ───────────────────────────────────────────────
    # Un sitemap doit vivre a la RACINE du domaine : son autorite ne couvre
    # que son propre repertoire. Servi depuis /api/, il ne pourrait declarer
    # aucune URL hors de /api/ et Google le rejetterait.
    #
    # Le `=` impose une correspondance exacte, donc prioritaire sur `location /`
    # qui enverrait sinon ces deux chemins au conteneur frontend (404).
    location = /sitemap-products.xml {
        proxy_pass http://backend/api/sitemap-products.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap-categories.xml {
        proxy_pass http://backend/api/sitemap-categories.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /django-admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/mediafiles/;
    }
}

