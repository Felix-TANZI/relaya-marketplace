<!doctype html>
<html lang="fr" data-theme="light" data-app="adm">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F6F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08090B" media="(prefers-color-scheme: dark)" />
    <title>BelivaY — Console d’administration</title>
    <meta name="description" content="BelivaY, console d’administration : file d’action, litiges, argent, acteurs, logistique, pilotage et gouvernance." />
    <meta name="application-name" content="BelivaY console" />
    <meta name="apple-mobile-web-app-title" content="BelivaY console" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/admin/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/admin/apple-touch-icon.png" />
    <link rel="manifest" href="/admin/manifest.webmanifest" />
    <!-- Fond posé avant le premier rendu (aucun éclair blanc en sombre, aucun noir en clair) : thème et taille du texte
         lus dans les préférences gardées (src/preferences.tsx) par public/theme-initial.js (fichier séparé : la politique de
         sécurité de Vercel interdit les scripts en ligne), mêmes fonds que src/styles/jetons.css. -->
    <script src="%BASE_URL%theme-initial.js"></script>
    <style>
      html{background:#F4F6F8;color-scheme:light}
      html[data-theme=dark]{background:#08090B;color-scheme:dark}
      body{margin:0;background:inherit}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
